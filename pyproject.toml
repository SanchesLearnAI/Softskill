[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "softskill"
version = "0.1.0"
description = "Undergraduate exploratory SoftSkill reproduction and shared-prefix extension"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "See AUTHORS.md for upstream and derivative credits"},
]
maintainers = [
    {name = "Yanbing (@SanchesLearnAI)"},
]
keywords = ["agent", "prompt-optimization", "soft-prefix", "skill-learning", "LLM", "agentic"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "openai>=1.30.0",
    "pyyaml>=6.0",
    "numpy>=1.24.0",
    "openpyxl>=3.1.0",
    "azure-identity>=1.15.0",
    "azure-core>=1.30.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
alfworld = ["alfworld>=0.4.0", "gymnasium>=0.29.0"]
claude = ["claude-agent-sdk>=0.1.0"]
qwen = ["vllm>=0.4.0"]
softprefix = ["torch", "transformers", "peft", "qwen-vl-utils"]
docs = ["mkdocs-material>=9.5.0", "mkdocstrings[python]>=0.24.0"]
webui = ["gradio>=4.0.0"]
dev = ["ruff>=0.4.0", "pytest>=8.0.0"]
all = [
    "alfworld>=0.4.0",
    "gymnasium>=0.29.0",
    "claude-agent-sdk>=0.1.0",
]

[project.scripts]
softskill-train = "scripts.train:main"
softskill-eval = "scripts.eval_only:main"
softskill-train-soft-prefix = "scripts.train_soft_prefix:main"
skillopt-train = "scripts.train:main"
skillopt-eval = "scripts.eval_only:main"
skillopt-train-soft-prefix = "scripts.train_soft_prefix:main"

[project.urls]
Homepage = "https://github.com/SanchesLearnAI/Softskill"
Documentation = "https://sancheslearnai.github.io/Softskill"
Repository = "https://github.com/SanchesLearnAI/Softskill"
Issues = "https://github.com/SanchesLearnAI/Softskill/issues"

[tool.setuptools.packages.find]
include = ["skillopt*", "scripts*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
