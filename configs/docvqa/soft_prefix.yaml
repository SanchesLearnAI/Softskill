_base_: default.yaml

# Supervised soft-prefix tuning for DocVQA with Qwen3-VL.
# Requires split CSVs with valid image_path values and qwen-vl-utils installed.

train:
  num_epochs: 3
  batch_size: 1
  accumulation: 4

evaluation:
  gate_metric: soft
  sel_env_num: 32
  test_env_num: 0

soft_prefix:
  model_name: Qwen/Qwen3.5-4B
  num_soft_skills: 2
  architecture: vision_lm
  prefix_length: 32
  learning_rate: 0.001
  weight_decay: 0.0
  max_prompt_tokens: 16384
  # 0 = auto; DocVQA images are downscaled to leave room for text tokens.
  docvqa_max_image_tokens: 0
  max_target_tokens: 64
  max_new_tokens: 64
  torch_dtype: auto
  device: auto
  trust_remote_code: true
  init_text_path: skillopt/envs/docvqa/skills/initial.md
  generation_temperature: 0.0
