_base_: default.yaml

# Supervised soft-prefix tuning for LiveMathematicianBench.
# LiveMath is text-only; keep it on the causal-LM wrapper. DocVQA uses the
# multimodal Qwen3-VL wrapper in its own config.

train:
  num_epochs: 3
  batch_size: 8
  accumulation: 1

evaluation:
  gate_metric: hard
  sel_env_num: 64
  test_env_num: 0

soft_prefix:
  model_name: Qwen/Qwen3.5-4B
  num_soft_skills: 2
  architecture: causal_lm
  prefix_length: 32
  injection_position: skill_section
  learning_rate: 0.001
  weight_decay: 0.0
  max_prompt_tokens: 2048
  max_target_tokens: 16
  max_new_tokens: 16
  torch_dtype: auto
  device: auto
  trust_remote_code: false
  init_text_path: skillopt/envs/livemathematicianbench/skills/initial.md
  generation_temperature: 0.0
  inference_backend: vllm_prompt_embeds
  inference_base_url: http://127.0.0.1:8000
  inference_timeout_seconds: 300
