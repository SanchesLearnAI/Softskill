_base_: default.yaml

# Supervised soft-prefix tuning for ALFWorld.
# This keeps the backbone frozen and trains only a prefix embedding inserted
# before the prompt embeddings. Use an open-weight causal LM available locally
# or from Hugging Face.
#
# Trajectory SFT:
#   Default rollout uses the configured OpenAI-compatible target model
#   (model.target / model.target_backend from the base config). To share one
#   teacher trajectory cache across different student prefix models, set
#   soft_prefix.trajectory_rollout_dir to a fixed path. Set
#   trajectory_rollout_backend: vllm to keep the previous vLLM-served rollout.

train:
  num_epochs: 3
  batch_size: 1
  accumulation: 2

evaluation:
  gate_metric: soft
  sel_env_num: 64
  test_env_num: 0

model:
  target: gpt-4o
  target_backend: openai_chat
  reasoning_effort: ""

env:
  max_steps: 50
  max_completion_tokens: 16384
  workers: 8
  max_api_workers: 1
  limit: 0


soft_prefix:
  num_soft_skills: 2
  model_name: Qwen/Qwen3.5-4B
  # prefix_length: number of soft-prefix tokens to train.
  # Set to "auto" to use the token count of the init_text_path document.
  prefix_length: 32
  learning_rate: 0.001
  weight_decay: 0.0
  max_prompt_tokens: 16384
  max_target_tokens: 512
  max_new_tokens: 512
  trajectory_max_new_tokens: 16384
  torch_dtype: auto
  device: auto
  trust_remote_code: false
  init_text_path: skillopt/envs/alfworld/skills/initial.md
  generation_temperature: 0.0
  inference_backend: vllm_prompt_embeds
  inference_base_url: http://127.0.0.1:8010
  inference_timeout_seconds: 300
  training_data: trajectory_sft
  trajectory_rollout_backend: openai_compatible
  trajectory_rollout_dir: "rollouts/teacher_gpt4o_alfworld_rollouts"
  trajectory_min_hard: 1.0
  trajectory_min_soft: 0.0
  trajectory_max_examples: 0
  trajectory_max_context_chars: 30000
  strip_trajectory_thoughts: false
